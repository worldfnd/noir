name: Goldilocks

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - provekit-v2

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  goldilocks:
    name: Goldilocks build and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: x86_64-unknown-linux-gnu-goldilocks
          cache-on-failure: true
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.88

      # TODO: drop the feature flag once the field is picked at runtime via FieldConfig and move the frontend/comptime tests to the default build. nargo_cli and wasm hard-enable bn254, so this stays noirc_driver-only.
      - name: Build the goldilocks variant
        run: cargo build -p noirc_driver --features goldilocks --locked
        env:
          RUSTFLAGS: "-Dwarnings"

      # TODO: the excluded frontend tests pin bn254 values and the stdlib still trips the other driver tests; trim this to acir_field and the evaluator's goldilocks probes once the frontend and ABI take the field at runtime.
      - name: Run the goldilocks tests
        run: |
          cargo nextest run --locked --features goldilocks \
            -p acir_field -p noirc_abi -p noirc_frontend -p noirc_evaluator -p noirc_driver \
            -E 'package(acir_field) | package(noirc_abi) | test(goldilocks_validation) | (package(noirc_driver) & binary(stdlib_field_casts)) | (package(noirc_frontend) & !(test(foreign::tests::test_blackbox_implemented) | test(try_simplify_partial_constants_does_not_simplify_large_field_elements) | test(meta_quote_roundtrip::roundtrip_field_values) | test(skip_interpreter_on_fail::comptime_for_loop_with_end_value_out_of_range) | test(skip_interpreter_on_fail::regression_10861_1) | test(wraps_aliased_builtin_functions)))'
        env:
          RUSTFLAGS: "-Dwarnings"
